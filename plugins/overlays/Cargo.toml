# `overlays` plugin — the user-facing face of the overlay feature, and the thing
# that makes the `webview` module installable: it declares `requires: webview`,
# so installing this plugin pulls the module in through the normal dependency
# resolution (modules are never browsable on their own).
# Built for wasm32-wasip2:  cargo build -p overlays --target wasm32-wasip2 --release
[package]
name = "overlays"
version = "0.1.0"
edition = "2021"
# Reference extension: proprietary, source-available, (C) Ascol57 — third-party
# extensions may pick any licence (Extension Exception). See LICENSE-EXTENSIONS.
license = "LicenseRef-Ascol57-Proprietary"

[lib]
crate-type = ["cdylib"]

[dependencies]
quicktys-plugin-sdk = { path = "../../crates/quicktys-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "=0.36.0"
