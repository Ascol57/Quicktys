# `obs` plugin — user-facing OBS triggers (and later actions), bridged from the
# certified `obs` module. Built for wasm32-wasip2:
#   cargo build -p obs-plugin --target wasm32-wasip2 --release
[package]
name = "obs-plugin"
version = "0.1.0"
edition = "2021"
# Reference extension: proprietary, source-available, (C) Ascol57 — third-party
# extensions may pick any licence (Extension Exception). See LICENSE-EXTENSIONS.
license = "LicenseRef-Ascol57-Proprietary"

[lib]
crate-type = ["cdylib"]

[dependencies]
quicktys-plugin-sdk = { path = "../../crates/quicktys-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "=0.36.0"
