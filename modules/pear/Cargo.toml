# Certified MODULE: driver for Pear Desktop's local HTTP API (a youtube-music
# fork exposing /api/v1 on http://localhost:26538). Uses the `net` system cap.
#   (cd modules/pear && cargo build --target wasm32-wasip2 --release)
[package]
name = "pear"
version = "0.1.0"
edition = "2021"
# Reference extension: proprietary, source-available, (C) Ascol57 — third-party
# extensions may pick any licence (Extension Exception). See LICENSE-EXTENSIONS.
license = "LicenseRef-Ascol57-Proprietary"

[lib]
crate-type = ["cdylib"]

[dependencies]
quicktys-module-sdk = { path = "../../crates/quicktys-module-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "=0.36.0"
