<!doctype html>
<!-- Overlay editor — the `webview` module's contributed page (M-view). Runs in a
     sandboxed ViewFrame; talks to ITS OWN module services through the host bridge
     (postMessage). Composes browser-source overlays: runtime widgets freely
     positioned/sized in PERCENTAGES on a fixed-aspect canvas, rendered identically
     at any OBS output resolution. Copy the /overlay/<id> URL into an OBS Browser
     source.

     WYSIWYG: each placed widget is rendered for real in a sandboxed, inert
     iframe (`pointer-events: none`, so the editor keeps every click), fed the
     same config the overlay will use. Drag from anywhere on a widget, resize
     from eight handles, nudge with the arrows; edges snap to the canvas sides
     and centre and to the other widgets, with a guide shown for whatever
     matched (Alt places freely). -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Overlays</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #141414; color: #e6e6e6; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: .5rem; padding: .7rem 1rem; border-bottom: 1px solid #262626; flex-wrap: wrap; }
  header h2 { margin: 0 .5rem 0 0; font-size: 1.15rem; }
  select, input, button { font: inherit; color: inherit; }
  select, input[type=text] { background: #1c1c1c; border: 1px solid #333; border-radius: 6px; padding: .35rem .5rem; }
  input#name { width: 15rem; }
  .btn { background: #262626; border: 1px solid #333; border-radius: 6px; padding: .35rem .6rem; cursor: pointer; display: inline-flex; align-items: center; gap: .35rem; }
  .btn:hover { background: #303030; }
  .btn.primary { background: #3a5; border-color: #3a5; color: #06210f; font-weight: 600; }
  .btn.danger { color: #e5827a; }
  .spacer { flex: 1; }
  .tip { flex-basis: 100%; opacity: .45; font-size: .75rem; }
  .seg { display: inline-flex; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
  .seg button { background: #1c1c1c; border: 0; padding: .35rem .6rem; cursor: pointer; }
  .seg button.on { background: #3a5; color: #06210f; font-weight: 600; }
  .url { display: inline-flex; align-items: center; gap: .3rem; font-size: .78rem; color: #9a9a9a; background: #191919; border: 1px solid #2a2a2a; border-radius: 6px; padding: .1rem .2rem .1rem .55rem; }
  .url code { color: #cfcfcf; }
  .url button { background: none; border: 0; color: #bbb; cursor: pointer; padding: .1rem .3rem; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 1rem; container-type: size; }
  .canvas { position: relative; background: #000; box-shadow: 0 0 0 1px #333, 0 8px 30px rgba(0,0,0,.5); overflow: hidden; }
  .canvas.landscape { aspect-ratio: 16/9; width: min(100cqw, calc(100cqh * 16 / 9)); }
  .canvas.portrait { aspect-ratio: 9/16; height: min(100cqh, calc(100cqw * 9 / 16)); }
  .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #555; font-size: .85rem; pointer-events: none; text-align: center; padding: 1rem; }
  /* A node is dragged from ANYWHERE on it. The old design put the drag bar
     above the box (top: -1.5rem), which the canvas' `overflow: hidden` clipped
     as soon as a widget touched the top edge — making it impossible to move. */
  .node { position: absolute; border: 1px dashed rgba(126,194,126,.45); background: rgba(126,194,126,.05); cursor: move; }
  .node:hover { border-color: rgba(126,194,126,.8); }
  .node.sel { border: 1px solid #7ec27e; background: rgba(126,194,126,.09); box-shadow: 0 0 0 1px rgba(126,194,126,.35), 0 6px 22px rgba(0,0,0,.45); }
  /* The real widget, rendered but inert: clicks belong to the editor. */
  .node .frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; background: transparent; }
  .node .lbl {
    position: absolute; left: 0; bottom: 0; max-width: 100%;
    font-size: .68rem; color: #cfe8cf; background: rgba(0,0,0,.55);
    padding: .05rem .3rem; border-radius: 0 5px 0 0;
    pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Buttons live INSIDE the node, so they are never clipped by the canvas. */
  .node .bar {
    position: absolute; top: 2px; right: 2px; display: flex; gap: 1px;
    background: rgba(20,20,20,.85); border: 1px solid #333; border-radius: 5px;
    padding: .05rem .15rem; font-size: .72rem; opacity: 0; transition: opacity .12s;
  }
  .node:hover .bar, .node.sel .bar { opacity: 1; }
  .node .bar span { cursor: pointer; padding: 0 .18rem; line-height: 1.2; }
  .node .bar .rm { color: #e5827a; }
  .node .bar .cg { color: #9fc9e8; }
  .node .bar .z { color: #bbb; }
  /* Eight handles, shown on the selected node only. */
  .node .h { position: absolute; width: 9px; height: 9px; background: #7ec27e; border: 1px solid #10240f; border-radius: 2px; display: none; }
  .node.sel .h { display: block; }
  .h.nw { left: -5px; top: -5px; cursor: nwse-resize; }
  .h.n  { left: calc(50% - 4px); top: -5px; cursor: ns-resize; }
  .h.ne { right: -5px; top: -5px; cursor: nesw-resize; }
  .h.e  { right: -5px; top: calc(50% - 4px); cursor: ew-resize; }
  .h.se { right: -5px; bottom: -5px; cursor: nwse-resize; }
  .h.s  { left: calc(50% - 4px); bottom: -5px; cursor: ns-resize; }
  .h.sw { left: -5px; bottom: -5px; cursor: nesw-resize; }
  .h.w  { left: -5px; top: calc(50% - 4px); cursor: ew-resize; }
  /* Alignment guides + the live x/y/w/h readout while manipulating. */
  .guide { position: absolute; background: #ff4a80; pointer-events: none; z-index: 9; }
  .guide.v { width: 1px; top: 0; bottom: 0; }
  .guide.h { height: 1px; left: 0; right: 0; }
  .readout {
    position: absolute; z-index: 10; pointer-events: none;
    background: rgba(20,20,20,.9); border: 1px solid #333; border-radius: 5px;
    padding: .1rem .35rem; font-size: .7rem; color: #ddd;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .empty { display: flex; flex-direction: column; align-items: center; gap: .6rem; opacity: .65; }
  .empty .big { font-size: 2.4rem; }
  .pal { position: fixed; background: #1c1c1c; border: 1px solid #333; border-radius: 8px; padding: .3rem; min-width: 12rem; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 20; }
  .pal button { display: block; width: 100%; text-align: left; background: none; border: 0; color: #eee; padding: .4rem .5rem; border-radius: 5px; cursor: pointer; }
  .pal button:hover { background: #2c2c2c; }
  .pal .none { opacity: .5; padding: .5rem; font-size: .85rem; }
  /* Per-widget settings panel (same schema fields as the dashboard's form). */
  .cfg { position: fixed; z-index: 30; width: 19rem; max-height: 72vh; overflow: auto; background: #1c1c1c; border: 1px solid #333; border-radius: 8px; padding: .6rem .7rem; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .cfg h3 { margin: 0 0 .55rem; font-size: .9rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .cfg h3 .x { cursor: pointer; color: #999; font-weight: 400; }
  .cfg .row { display: flex; flex-direction: column; gap: .25rem; margin-bottom: .55rem; }
  .cfg .row.inline { flex-direction: row; align-items: center; justify-content: space-between; }
  .cfg .lbl2 { font-size: .78rem; opacity: .75; }
  .cfg select, .cfg input[type=text], .cfg input[type=number] { width: 100%; }
  .cfg input[type=color] { width: 2.1rem; height: 1.8rem; padding: 0; background: none; border: 1px solid #333; border-radius: 5px; cursor: pointer; }
  .cfg .colorrow { display: flex; gap: .4rem; align-items: center; }
  .cfg .colorrow input[type=text] { flex: 1; min-width: 0; }
  .cfg .rangerow { display: flex; gap: .5rem; align-items: center; }
  .cfg input[type=range] { flex: 1; }
  .cfg .val { font-variant-numeric: tabular-nums; opacity: .8; font-size: .78rem; min-width: 2.6rem; text-align: right; }
  .cfg .none { opacity: .5; font-size: .85rem; padding: .2rem 0 .4rem; }
</style>

<header>
  <h2 id="t-title">Overlays</h2>
  <select id="overlaySel"></select>
  <button class="btn" id="newBtn">＋ <span id="t-new">New</span></button>
  <input type="text" id="name" placeholder="Overlay name" style="display:none" />
  <div class="spacer"></div>
  <div id="editTools" style="display:none">
    <span class="seg" id="aspect">
      <button data-a="16:9">16:9</button>
      <button data-a="9:16">9:16</button>
    </span>
    <button class="btn" id="addBtn">＋ <span id="t-add">Add widget</span></button>
    <span class="url" title="Add this as a Browser source in OBS">
      <code id="url"></code>
      <button id="copyBtn" title="Copy URL">⧉</button>
    </span>
    <button class="btn danger" id="delBtn" title="Delete overlay">🗑</button>
  </div>
  <small class="tip" id="t-hint2"></small>
</header>

<main>
  <div id="stage" class="empty">
    <div class="big">🖥</div>
    <p id="t-none">No overlays yet.</p>
    <button class="btn primary" id="newBtn2"><span id="t-new2">New overlay</span></button>
  </div>
</main>

<script>
  // ---- host bridge (request/response over postMessage) --------------------
  const parentWin = window.parent;
  let reqSeq = 0;
  const pending = new Map();
  function send(msg) { parentWin.postMessage({ source: "quicktys-view", ...msg }, "*"); }
  function call(service, args = {}) {
    const reqId = ++reqSeq;
    send({ type: "call", reqId, service, args });
    return new Promise((resolve, reject) => pending.set(reqId, { resolve, reject }));
  }
  const copy = (text) => send({ type: "copy", text });

  // ---- tiny i18n ----------------------------------------------------------
  const STR = {
    en: { title: "Overlays", new: "New", add: "Add widget", none: "No overlays yet.", new2: "New overlay",
          untitled: "New overlay", hint: "Add a widget, then drag to place and resize it.", nomatch: "No widgets", del: "Delete this overlay?",
          settings: "Settings", nosettings: "This widget has no settings.",
          remove: "Remove", bringFront: "Bring forward", sendBack: "Send backward",
          hint2: "Drag to place · handles to resize · arrows to nudge · Alt to ignore guides" },
    fr: { title: "Overlays", new: "Nouveau", add: "Ajouter un widget", none: "Aucun overlay.", new2: "Nouvel overlay",
          untitled: "Nouvel overlay", hint: "Ajoutez un widget, puis glissez pour le placer et le redimensionner.", nomatch: "Aucun widget", del: "Supprimer cet overlay ?",
          settings: "Réglages", nosettings: "Ce widget n'a pas de réglages.",
          remove: "Retirer", bringFront: "Passer devant", sendBack: "Passer derrière",
          hint2: "Glissez pour placer · poignées pour redimensionner · flèches pour ajuster · Alt pour ignorer les repères" },
  };
  let S = STR.en;

  // ---- state --------------------------------------------------------------
  let catalog = [];          // widget bundles
  let overlays = [];         // [{id,name,aspect,widgets:[...]}]
  let currentId = null;
  const SERVER_PORT = 8787;  // mirrors webserver::DEFAULT_PORT

  const current = () => overlays.find((o) => o.id === currentId) || null;
  const overlayWidgets = () => catalog.filter((w) => !w.template); // runtime widgets only
  const newId = (p) => p + "-" + Math.random().toString(36).slice(2, 8);
  const bundleOf = (type) => catalog.find((w) => w.id === type) || null;
  // `label` is the translated name the host resolves for us (manifests ship i18n
  // keys, and this sandboxed page has no access to the app's i18n).
  const widgetName = (type) => { const b = bundleOf(type); return b?.label || b?.name || type; };

  async function reload() {
    overlays = (await call("list-overlays")) || [];
    if (!overlays.some((o) => o.id === currentId)) currentId = overlays[0]?.id ?? null;
    render();
  }

  // Debounced persistence of the current overlay.
  let saveTimer = null;
  function save() {
    const o = current();
    if (!o) return;
    clearTimeout(saveTimer);
    const snap = JSON.parse(JSON.stringify(o));
    saveTimer = setTimeout(() => call("upsert-overlay", snap), 250);
  }

  // ---- overlay CRUD -------------------------------------------------------
  async function createOverlay() {
    const o = { id: newId("ov"), name: S.untitled, aspect: "16:9", widgets: [] };
    await call("upsert-overlay", o);
    currentId = o.id;
    await reload();
  }
  async function deleteOverlay() {
    const o = current();
    if (!o || !confirm(S.del)) return;
    await call("delete-overlay", { id: o.id });
    currentId = null;
    await reload();
  }
  function defaultConfig(w) {
    const cfg = {};
    for (const [k, s] of Object.entries(w.config?.properties ?? {})) {
      if (s.default !== undefined) cfg[k] = s.default;
      else if (Array.isArray(s.enum)) cfg[k] = s.enum[0];
      else { const t = String(s.type || "").toLowerCase(); cfg[k] = t === "boolean" ? true : (t === "number" || t === "integer") ? 0 : ""; }
    }
    return cfg;
  }
  function addWidget(type) {
    const w = catalog.find((x) => x.id === type);
    const o = current();
    if (!w || !o) return;
    o.widgets.push({ id: newId("w"), type: w.id, x: 5, y: 5, w: 40, h: 25, config: defaultConfig(w) });
    save(); render();
  }
  function removeWidget(id) {
    const o = current();
    if (!o) return;
    o.widgets = o.widgets.filter((w) => w.id !== id);
    save(); render();
  }

  // ---- selection, drag, resize, snapping ---------------------------------
  //
  // Everything is in PERCENTAGES of the canvas, so an overlay renders the same
  // at any OBS output resolution. A node is dragged from anywhere on itself;
  // the eight handles resize it. Edges snap to the canvas (sides + centre) and
  // to the other widgets' edges and centres, with a guide drawn for whatever
  // matched — hold Alt to place freely.
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const SNAP = 1.2;   // % — about 20px on a 1080p-wide canvas
  const MIN = 4;      // % — a widget smaller than this is unusable

  let selectedId = null;
  let drag = null;
  let resize = null;

  function select(id) {
    if (selectedId === id) return;
    selectedId = id;
    for (const el of document.querySelectorAll(".node")) {
      el.classList.toggle("sel", el.id === "node-" + id);
    }
  }

  /// Positions worth snapping to on each axis: the canvas sides and centre,
  /// plus every OTHER widget's sides and centre.
  function snapTargets(exceptId) {
    const xs = [0, 50, 100];
    const ys = [0, 50, 100];
    for (const other of current()?.widgets ?? []) {
      if (other.id === exceptId) continue;
      xs.push(other.x, other.x + other.w, other.x + other.w / 2);
      ys.push(other.y, other.y + other.h, other.y + other.h / 2);
    }
    return { xs, ys };
  }

  /// Best correction that brings one of `edges` onto a target, or none.
  function snapAxis(edges, targets, disabled) {
    if (disabled) return { delta: 0, guide: null };
    let best = null;
    for (const edge of edges) {
      for (const target of targets) {
        const delta = target - edge;
        if (Math.abs(delta) <= SNAP && (!best || Math.abs(delta) < Math.abs(best.delta))) {
          best = { delta, guide: target };
        }
      }
    }
    return best ?? { delta: 0, guide: null };
  }

  function showGuides(canvas, x, y) {
    for (const el of canvas.querySelectorAll(".guide")) el.remove();
    const add = (cls, style) => {
      const g = document.createElement("div");
      g.className = "guide " + cls;
      g.style.cssText = style;
      canvas.appendChild(g);
    };
    if (x !== null) add("v", `left:${x}%`);
    if (y !== null) add("h", `top:${y}%`);
  }
  function clearGuides() {
    for (const el of document.querySelectorAll(".guide, .readout")) el.remove();
  }

  function showReadout(canvas, w) {
    let el = canvas.querySelector(".readout");
    if (!el) {
      el = document.createElement("div");
      el.className = "readout";
      canvas.appendChild(el);
    }
    el.textContent = `${Math.round(w.x)},${Math.round(w.y)} · ${Math.round(w.w)}×${Math.round(w.h)}`;
    el.style.left = clamp(w.x, 0, 80) + "%";
    // Above the node, or below it when there is no room at the top.
    el.style.top = (w.y > 8 ? w.y - 6 : w.y + w.h + 1) + "%";
  }

  function startMove(e, w, rect) {
    select(w.id);
    drag = { w, x: e.clientX, y: e.clientY, sx: w.x, sy: w.y, rect };
    bindDrag();
  }
  function startResize(e, w, rect, dir) {
    select(w.id);
    resize = { w, dir, x: e.clientX, y: e.clientY, sx: w.x, sy: w.y, sw: w.w, sh: w.h, rect };
    bindDrag();
  }
  function bindDrag() {
    window.addEventListener("mousemove", onDrag);
    window.addEventListener("mouseup", endDrag);
  }

  function onDrag(e) {
    const canvas = document.querySelector(".canvas");
    if (!canvas) return;
    const free = e.altKey; // Alt disables snapping

    if (drag) {
      const { w, rect } = drag;
      const dx = ((e.clientX - drag.x) / rect.width) * 100;
      const dy = ((e.clientY - drag.y) / rect.height) * 100;
      let x = clamp(drag.sx + dx, 0, 100 - w.w);
      let y = clamp(drag.sy + dy, 0, 100 - w.h);

      const { xs, ys } = snapTargets(w.id);
      const sx = snapAxis([x, x + w.w, x + w.w / 2], xs, free);
      const sy = snapAxis([y, y + w.h, y + w.h / 2], ys, free);
      x = clamp(x + sx.delta, 0, 100 - w.w);
      y = clamp(y + sy.delta, 0, 100 - w.h);

      w.x = x;
      w.y = y;
      positionNode(w);
      showGuides(canvas, sx.guide, sy.guide);
      showReadout(canvas, w);
      return;
    }

    if (!resize) return;
    const { w, rect, dir } = resize;
    const dx = ((e.clientX - resize.x) / rect.width) * 100;
    const dy = ((e.clientY - resize.y) / rect.height) * 100;
    const right = resize.sx + resize.sw;
    const bottom = resize.sy + resize.sh;

    // Each direction moves only the edges it names; the opposite edge is fixed.
    if (dir.includes("e")) w.w = clamp(resize.sw + dx, MIN, 100 - w.x);
    if (dir.includes("s")) w.h = clamp(resize.sh + dy, MIN, 100 - w.y);
    if (dir.includes("w")) {
      w.x = clamp(resize.sx + dx, 0, right - MIN);
      w.w = right - w.x;
    }
    if (dir.includes("n")) {
      w.y = clamp(resize.sy + dy, 0, bottom - MIN);
      w.h = bottom - w.y;
    }

    const { xs, ys } = snapTargets(w.id);
    const sx = snapAxis([dir.includes("w") ? w.x : w.x + w.w], xs, free);
    const sy = snapAxis([dir.includes("n") ? w.y : w.y + w.h], ys, free);
    if (sx.delta) {
      if (dir.includes("w")) { const r = w.x + w.w; w.x = clamp(w.x + sx.delta, 0, r - MIN); w.w = r - w.x; }
      else if (dir.includes("e")) w.w = clamp(w.w + sx.delta, MIN, 100 - w.x);
    }
    if (sy.delta) {
      if (dir.includes("n")) { const b = w.y + w.h; w.y = clamp(w.y + sy.delta, 0, b - MIN); w.h = b - w.y; }
      else if (dir.includes("s")) w.h = clamp(w.h + sy.delta, MIN, 100 - w.y);
    }

    positionNode(w);
    showGuides(canvas, sx.guide, sy.guide);
    showReadout(canvas, w);
  }

  function endDrag() {
    window.removeEventListener("mousemove", onDrag);
    window.removeEventListener("mouseup", endDrag);
    if (drag || resize) {
      // Percentages are stored rounded: the OBS page reads the same numbers the
      // readout showed, and a re-render can't drift by a fraction of a percent.
      const w = (drag || resize).w;
      w.x = Math.round(w.x); w.y = Math.round(w.y);
      w.w = Math.round(w.w); w.h = Math.round(w.h);
      positionNode(w);
      save();
    }
    clearGuides();
    drag = resize = null;
  }

  function positionNode(w) {
    const el = document.getElementById("node-" + w.id);
    if (el) {
      el.style.left = w.x + "%";
      el.style.top = w.y + "%";
      el.style.width = w.w + "%";
      el.style.height = w.h + "%";
    }
  }

  // ---- z-order --------------------------------------------------------------
  // Paint order IS array order, so raising a widget is moving it later.
  function reorder(id, direction) {
    const o = current();
    if (!o) return;
    const i = o.widgets.findIndex((w) => w.id === id);
    const j = i + direction;
    if (i < 0 || j < 0 || j >= o.widgets.length) return;
    const list = [...o.widgets];
    [list[i], list[j]] = [list[j], list[i]];
    o.widgets = list;
    save();
    renderStage();
    select(id);
  }

  // ---- keyboard -------------------------------------------------------------
  // Arrows nudge the selection (Shift = 10%), Delete removes it, Escape drops
  // the selection. Ignored while typing in a field or the settings panel.
  document.addEventListener("keydown", (e) => {
    if (!selectedId) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    const o = current();
    const w = o?.widgets.find((x) => x.id === selectedId);
    if (!w) return;

    if (e.key === "Escape") {
      select(null);
      closeConfig();
      return;
    }
    if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault();
      removeWidget(selectedId);
      selectedId = null;
      return;
    }
    const step = e.shiftKey ? 10 : 1;
    const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    const move = moves[e.key];
    if (!move) return;
    e.preventDefault();
    w.x = clamp(w.x + move[0], 0, 100 - w.w);
    w.y = clamp(w.y + move[1], 0, 100 - w.h);
    positionNode(w);
    save();
  });

  // ---- add-widget palette -------------------------------------------------
  function openPalette(anchor) {
    closePalette();
    const pal = document.createElement("div");
    pal.className = "pal"; pal.id = "palette";
    const items = overlayWidgets();
    if (!items.length) { const d = document.createElement("div"); d.className = "none"; d.textContent = S.nomatch; pal.appendChild(d); }
    for (const w of items) {
      const b = document.createElement("button");
      b.textContent = w.name || w.id;
      b.onclick = () => { addWidget(w.id); closePalette(); };
      pal.appendChild(b);
    }
    document.body.appendChild(pal);
    const r = anchor.getBoundingClientRect();
    pal.style.left = Math.min(r.left, window.innerWidth - pal.offsetWidth - 8) + "px";
    pal.style.top = r.bottom + 4 + "px";
    setTimeout(() => document.addEventListener("mousedown", onDocDown), 0);
  }
  function onDocDown(e) { if (!e.target.closest("#palette") && e.target.id !== "addBtn") closePalette(); }
  function closePalette() { document.getElementById("palette")?.remove(); document.removeEventListener("mousedown", onDocDown); }

  // ---- per-widget settings -------------------------------------------------
  // Mirrors the dashboard's WidgetConfigForm: the control is inferred from the
  // widget's declared config schema, and the labels come translated from the
  // host (manifests ship i18n keys; this sandboxed page has no i18n of its own).
  function fieldKind(s) {
    if (Array.isArray(s.enum)) return "enum";
    const t = String(s.type || "").toLowerCase();
    if (t === "boolean" || t === "toggle") return "boolean";
    if (t === "color") return "color";
    if ((t === "number" || t === "integer") && s.min != null && s.max != null) return "range";
    if (t === "number" || t === "integer") return "number";
    return "text";
  }

  function configRow(bundle, key, schema, w) {
    const kind = fieldKind(schema);
    const row = document.createElement("div");
    row.className = "row" + (kind === "boolean" ? " inline" : "");
    const label = document.createElement("label");
    label.className = "lbl2";
    label.textContent = bundle?.configLabels?.[key] || key;
    row.appendChild(label);

    const cur = w.config[key];
    const set = (v) => { w.config[key] = v; save(); };

    if (kind === "boolean") {
      const input = document.createElement("input");
      input.type = "checkbox";
      // Unset means ON — the same reading the widgets themselves use.
      input.checked = cur !== false;
      input.onchange = () => set(input.checked);
      row.appendChild(input);
    } else if (kind === "enum") {
      const sel = document.createElement("select");
      for (const v of schema.enum) {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = bundle?.optionLabels?.[key]?.[v] ?? String(v);
        if ((cur ?? schema.default) === v) opt.selected = true;
        sel.appendChild(opt);
      }
      sel.onchange = () => set(sel.value);
      row.appendChild(sel);
    } else if (kind === "color") {
      const wrap = document.createElement("div"); wrap.className = "colorrow";
      const pick = document.createElement("input"); pick.type = "color";
      const hex = document.createElement("input"); hex.type = "text";
      const initial = cur ?? schema.default ?? "#000000";
      pick.value = initial; hex.value = initial;
      pick.oninput = () => { hex.value = pick.value; set(pick.value); };
      hex.oninput = () => { set(hex.value); if (/^#[0-9a-f]{6}$/i.test(hex.value)) pick.value = hex.value; };
      wrap.append(pick, hex);
      row.appendChild(wrap);
    } else if (kind === "range") {
      const wrap = document.createElement("div"); wrap.className = "rangerow";
      const input = document.createElement("input");
      input.type = "range"; input.min = schema.min; input.max = schema.max;
      input.value = cur ?? schema.default ?? schema.min;
      const out = document.createElement("span"); out.className = "val"; out.textContent = input.value;
      input.oninput = () => { out.textContent = input.value; set(Number(input.value)); };
      wrap.append(input, out);
      row.appendChild(wrap);
    } else if (kind === "number") {
      const input = document.createElement("input");
      input.type = "number";
      if (schema.min != null) input.min = schema.min;
      if (schema.max != null) input.max = schema.max;
      input.value = cur ?? schema.default ?? 0;
      input.oninput = () => set(Number(input.value));
      row.appendChild(input);
    } else {
      const input = document.createElement("input");
      input.type = "text";
      input.value = cur ?? schema.default ?? "";
      input.oninput = () => set(input.value);
      row.appendChild(input);
    }
    return row;
  }

  function openConfig(w, anchor) {
    closeConfig();
    const bundle = bundleOf(w.type);
    const props = bundle?.config?.properties ?? {};
    if (!w.config) w.config = {};

    const panel = document.createElement("div");
    panel.className = "cfg"; panel.id = "cfgPanel";
    const head = document.createElement("h3");
    const title = document.createElement("span");
    title.textContent = widgetName(w.type) + " — " + S.settings;
    const x = document.createElement("span");
    x.className = "x"; x.textContent = "✕"; x.onclick = closeConfig;
    head.append(title, x);
    panel.appendChild(head);

    const keys = Object.keys(props);
    if (!keys.length) {
      const none = document.createElement("div");
      none.className = "none"; none.textContent = S.nosettings;
      panel.appendChild(none);
    }
    for (const key of keys) panel.appendChild(configRow(bundle, key, props[key], w));

    document.body.appendChild(panel);
    const r = anchor.getBoundingClientRect();
    panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - panel.offsetWidth - 8)) + "px";
    panel.style.top = Math.max(8, Math.min(r.bottom + 6, window.innerHeight - panel.offsetHeight - 8)) + "px";
    setTimeout(() => {
      document.addEventListener("mousedown", onCfgDown);
      document.addEventListener("keydown", onCfgKey);
    }, 0);
  }
  function onCfgDown(e) { if (!e.target.closest("#cfgPanel") && !e.target.classList.contains("cg")) closeConfig(); }
  function onCfgKey(e) { if (e.key === "Escape") closeConfig(); }
  function closeConfig() {
    document.getElementById("cfgPanel")?.remove();
    document.removeEventListener("mousedown", onCfgDown);
    document.removeEventListener("keydown", onCfgKey);
  }

  // ---- live widget previews -------------------------------------------------
  // Native serves each widget from its own `widget://` document (own origin, no
  // inherited CSP → its inline scripts run); the app CSP already allows
  // `frame-src widget:`. The browser mock has no such scheme, so it falls back
  // to the HTML the host embedded in the manifest.
  const NATIVE = location.protocol === "moduleui:" || location.hostname.endsWith(".localhost");

  function widgetUrl(id, file) {
    const windowsStyle = location.protocol === "http:" && location.hostname.endsWith(".localhost");
    const base = windowsStyle ? `http://widget.localhost/${id}/` : `widget://localhost/${id}/`;
    return base + (file || "");
  }

  /// The widget rendered as it will look on the overlay. Prefers its editor
  /// `preview` page (a self-demo, so an idle widget isn't just blank) and falls
  /// back to the real entry. Returns null for a widget that ships no HTML.
  function widgetFrame(bundle, placed) {
    if (!bundle) return null;
    const html = bundle.previewHtml || bundle.html;
    if (!NATIVE && !html) return null;
    const frame = document.createElement("iframe");
    frame.className = "frame";
    frame.setAttribute("sandbox", "allow-scripts");
    if (NATIVE) {
      frame.src = widgetUrl(bundle.id, bundle.preview || "");
    } else {
      frame.srcdoc = html;
    }
    // Feed it the same config the overlay will, so colours and options show.
    frame.addEventListener("load", () => {
      frame.contentWindow?.postMessage(
        { source: "quicktys", type: "config", config: placed.config ?? {} },
        "*",
      );
      frame.contentWindow?.postMessage({ source: "quicktys", type: "state", state: {} }, "*");
    });
    return frame;
  }

  // ---- render -------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  function render() {
    // Overlay selector
    const sel = $("overlaySel");
    sel.innerHTML = "";
    sel.style.display = overlays.length ? "" : "none";
    for (const o of overlays) {
      const opt = document.createElement("option");
      opt.value = o.id; opt.textContent = o.name || o.id; if (o.id === currentId) opt.selected = true;
      sel.appendChild(opt);
    }
    const o = current();
    $("name").style.display = o ? "" : "none";
    $("editTools").style.display = o ? "" : "none";
    if (o) {
      $("name").value = o.name || "";
      $("url").textContent = `http://localhost:${SERVER_PORT}/overlay/${o.id}`;
      for (const b of $("aspect").querySelectorAll("button")) b.classList.toggle("on", b.dataset.a === (o.aspect || "16:9"));
    }
    renderStage();
  }
  function renderStage() {
    // The panel holds a reference to a widget object this re-render replaces
    // (or removes) — drop it rather than leave a stale form open.
    closeConfig();
    const stage = $("stage");
    const o = current();
    if (!o) {
      stage.className = "empty";
      stage.innerHTML = `<div class="big">🖥</div><p>${S.none}</p><button class="btn primary" id="newBtn2b">${S.new2}</button>`;
      $("newBtn2b").onclick = createOverlay;
      return;
    }
    stage.className = "";
    const canvas = document.createElement("div");
    canvas.className = "canvas " + (o.aspect === "9:16" ? "portrait" : "landscape");
    if (!o.widgets.length) {
      const h = document.createElement("p");
      h.className = "hint";
      h.textContent = S.hint;
      canvas.appendChild(h);
    }
    for (const w of o.widgets) {
      const bundle = bundleOf(w.type);
      const node = document.createElement("div");
      node.className = "node" + (w.id === selectedId ? " sel" : "");
      node.id = "node-" + w.id;
      node.style.cssText = `left:${w.x}%;top:${w.y}%;width:${w.w}%;height:${w.h}%`;

      // WYSIWYG: render the ACTUAL widget, inert. `pointer-events: none` keeps
      // every click for the editor, so the preview can never eat a drag.
      const frame = widgetFrame(bundle, w);
      if (frame) node.appendChild(frame);

      const lbl = document.createElement("div");
      lbl.className = "lbl";
      lbl.textContent = widgetName(w.type);
      node.appendChild(lbl);

      // Toolbar INSIDE the node — the old one sat above it and was clipped by
      // the canvas whenever a widget touched the top edge.
      const bar = document.createElement("div");
      bar.className = "bar";
      const button = (cls, text, title, onClick) => {
        const b = document.createElement("span");
        b.className = cls;
        b.textContent = text;
        b.title = title;
        b.onmousedown = (e) => e.stopPropagation();
        b.onclick = (e) => { e.stopPropagation(); onClick(e); };
        return b;
      };
      bar.append(
        button("z", "▾", S.sendBack, () => reorder(w.id, -1)),
        button("z", "▴", S.bringFront, () => reorder(w.id, 1)),
        button("cg", "⚙", S.settings, (e) => openConfig(w, e.currentTarget)),
        button("rm", "✕", S.remove, () => removeWidget(w.id)),
      );
      node.appendChild(bar);

      for (const dir of ["nw", "n", "ne", "e", "se", "s", "sw", "w"]) {
        const h = document.createElement("div");
        h.className = "h " + dir;
        h.onmousedown = (e) => {
          e.preventDefault();
          e.stopPropagation();
          startResize(e, w, canvas.getBoundingClientRect(), dir);
        };
        node.appendChild(h);
      }

      // Drag from anywhere on the node.
      node.onmousedown = (e) => {
        e.preventDefault();
        startMove(e, w, canvas.getBoundingClientRect());
      };
      canvas.appendChild(node);
    }
    // Clicking the empty canvas clears the selection.
    canvas.onmousedown = (e) => {
      if (e.target === canvas) {
        select(null);
        closeConfig();
      }
    };
    stage.innerHTML = ""; stage.appendChild(canvas);
  }

  // ---- wire up static controls -------------------------------------------
  $("newBtn").onclick = createOverlay;
  $("newBtn2").onclick = createOverlay;
  $("delBtn").onclick = deleteOverlay;
  $("addBtn").onclick = (e) => openPalette(e.currentTarget);
  $("copyBtn").onclick = () => { const o = current(); if (o) copy(`http://localhost:${SERVER_PORT}/overlay/${o.id}`); };
  $("overlaySel").onchange = (e) => { currentId = e.target.value; render(); };
  $("name").oninput = (e) => { const o = current(); if (o) { o.name = e.target.value; save(); const opt = [...$("overlaySel").options].find((x) => x.value === o.id); if (opt) opt.textContent = o.name || o.id; } };
  for (const b of $("aspect").querySelectorAll("button")) b.onclick = () => { const o = current(); if (o) { o.aspect = b.dataset.a; save(); render(); } };

  // ---- bridge messages ----------------------------------------------------
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.source !== "quicktys") return;
    if (d.type === "init") {
      catalog = d.widgets || [];
      S = STR[d.locale] || STR.en;
      applyStrings();
      reload();
    } else if (d.type === "result") {
      const p = pending.get(d.reqId);
      if (!p) return;
      pending.delete(d.reqId);
      d.ok ? p.resolve(d.value) : p.reject(new Error(d.error || "call failed"));
    }
  });
  function applyStrings() {
    $("t-title").textContent = S.title; $("t-new").textContent = S.new; $("t-new2").textContent = S.new2;
    $("t-add").textContent = S.add; $("t-none").textContent = S.none;
    $("t-hint2").textContent = S.hint2;
  }

  // Tell the host we're ready → it replies with `init`.
  send({ type: "ready" });
</script>
