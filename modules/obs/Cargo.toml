# Reference MODULE scaffold ("how to talk to OBS").
# Built for the component-model target, certified before distribution:
#   cargo build -p obs-module --target wasm32-wasip2 --release
[package]
name = "obs-module"
version = "0.1.0"
edition = "2021"
# Reference extension: proprietary, source-available, (C) Ascol57 — third-party
# extensions may pick any licence (Extension Exception). See LICENSE-EXTENSIONS.
license = "LicenseRef-Ascol57-Proprietary"

[lib]
crate-type = ["cdylib"]

[dependencies]
quicktys-module-sdk = { path = "../../crates/quicktys-module-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wit-bindgen = "=0.36.0"
