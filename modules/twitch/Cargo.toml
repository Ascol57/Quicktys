# Certified MODULE: driver for Twitch's Helix API (chat, announcements, stream
# info) over the `net` system cap. A plugin can't touch the network, so anything
# Twitch-API goes through this. Auth (bearer token + client id) is injected by
# `set-auth`; `set-base-url` points it at a stand-in server for tests.
#   (cd modules/twitch && cargo build --target wasm32-wasip2 --release)
[package]
name = "twitch"
version = "0.1.0"
edition = "2021"
# Reference extension: proprietary, source-available, (C) Ascol57 — third-party
# extensions may pick any licence (Extension Exception). See LICENSE-EXTENSIONS.
license = "LicenseRef-Ascol57-Proprietary"

[lib]
crate-type = ["cdylib"]

[dependencies]
quicktys-module-sdk = { path = "../../crates/quicktys-module-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "=0.36.0"
