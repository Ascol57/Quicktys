<!doctype html>
<!-- Alert box widget (real): hidden until its named alert fires. The `alert.show`
     action pushes `{title, content, image, fired}` to state `alert.<name>`; on a
     new `fired` id the box animates in, holds for `duration`, then fades out.
     Transparent when idle → invisible in an OBS browser source until the event.
     The editor renders `preview.html` instead (a self-demo), so this file stays
     purely the real behaviour. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: transparent; }
      body {
        font-family: system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        container-type: size; /* descendants' cq units scale with the widget */
        /* Room for the box shadow so it's never clipped (blur + offset). */
        padding: min(52px, 13vmin);
        --bg: #1e1e1e; --title: #fff; --content: #c8c8c8; --accent: #d3695f; --radius: 14px;
      }
      .box {
        max-width: 100%; max-height: 100%; min-height: 0; min-width: 0;
        display: flex; flex-direction: column; align-items: center;
        gap: min(0.6rem, 3cqmin);
        padding: min(1rem, 5cqmin);
        background: var(--bg);
        border-top: max(2px, 0.8cqmin) solid var(--accent);
        border-radius: var(--radius);
        box-shadow: 0 min(10px, 2cqmin) min(40px, 9cqmin) rgba(0, 0, 0, 0.45);
        text-align: center;
        opacity: 0; transform: translateY(min(12px, 3cqmin)) scale(0.96);
        transition: opacity 0.3s ease, transform 0.3s ease;
        pointer-events: none;
      }
      body.show .box { opacity: 1; transform: translateY(0) scale(1); }
      .img {
        flex: 0 1 auto; min-height: 0; max-width: 100%; max-height: 55cqh;
        object-fit: contain; border-radius: calc(var(--radius) - 4px);
      }
      .title {
        color: var(--title); font-weight: 800; line-height: 1.15;
        font-size: min(1.4rem, 8cqmin); max-width: 100%; overflow-wrap: anywhere;
      }
      .content {
        color: var(--content); line-height: 1.3;
        font-size: min(1rem, 5cqmin); max-width: 100%; overflow-wrap: anywhere;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="box" id="box">
      <img class="img hidden" id="img" alt="" />
      <div class="title hidden" id="title"></div>
      <div class="content hidden" id="content"></div>
    </div>

    <script>
      let state = {};
      let config = {};
      let lastFired = null;
      let hideTimer = null;
      const $ = (id) => document.getElementById(id);
      const alertName = () => config.name || "alert";
      const duration = () => Number(config.duration) || 5000;

      function applyConfig() {
        const s = document.body.style;
        const set = (k, v) => v !== undefined && s.setProperty(k, v);
        set("--bg", config.bgColor);
        set("--title", config.titleColor);
        set("--content", config.contentColor);
        set("--accent", config.accentColor);
        if (config.radius !== undefined) s.setProperty("--radius", config.radius + "px");
      }
      function setEl(el, text) {
        const has = !!(text && String(text).length);
        el.textContent = has ? text : "";
        el.classList.toggle("hidden", !has);
      }
      function fire(a) {
        const img = $("img");
        if (a.image) { img.src = a.image; img.classList.remove("hidden"); }
        else img.classList.add("hidden");
        setEl($("title"), a.title);
        setEl($("content"), a.content);
        document.body.classList.add("show");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => document.body.classList.remove("show"), duration());
      }
      function onState() {
        const a = state["alert." + alertName()];
        if (a && typeof a === "object" && a.fired !== lastFired) {
          lastFired = a.fired;
          fire(a);
        }
      }
      window.addEventListener("message", (e) => {
        const d = e.data;
        if (!d || d.source !== "quicktys") return;
        if (d.type === "config") {
          config = d.config || {};
          applyConfig();
          const a = state["alert." + alertName()];
          if (a && typeof a === "object") lastFired = a.fired; // don't replay on edit
        } else if (d.type === "state") {
          state = d.state || {};
          onState();
        }
      });
      applyConfig();
      parent.postMessage({ source: "quicktys-widget", type: "ready" }, "*");
    </script>
  </body>
</html>
