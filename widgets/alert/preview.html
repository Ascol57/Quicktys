<!doctype html>
<!-- Alert box PREVIEW: a separate page used only by the in-app webview editor
     (WidgetFrame loads it in place of index.html when previewing). It receives
     the widget's config through the same postMessage bridge as the real widget,
     then loops a placeholder alert on the configured timing so you can design the
     look without firing a real event. The browser-source (OBS) never loads this
     file — it always uses index.html, which stays idle until the real event. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: transparent; }
      body {
        font-family: system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        container-type: size;
        padding: min(52px, 13vmin);
        --bg: #1e1e1e; --title: #fff; --content: #c8c8c8; --accent: #d3695f; --radius: 14px;
      }
      .box {
        max-width: 100%; max-height: 100%; min-height: 0; min-width: 0;
        display: flex; flex-direction: column; align-items: center;
        gap: min(0.6rem, 3cqmin);
        padding: min(1rem, 5cqmin);
        background: var(--bg);
        border-top: max(2px, 0.8cqmin) solid var(--accent);
        border-radius: var(--radius);
        box-shadow: 0 min(10px, 2cqmin) min(40px, 9cqmin) rgba(0, 0, 0, 0.45);
        text-align: center;
        opacity: 0; transform: translateY(min(12px, 3cqmin)) scale(0.96);
        transition: opacity 0.3s ease, transform 0.3s ease;
        pointer-events: none;
      }
      body.show .box { opacity: 1; transform: translateY(0) scale(1); }
      .img {
        flex: 0 1 auto; min-height: 0; max-width: 100%; max-height: 55cqh;
        object-fit: contain; border-radius: calc(var(--radius) - 4px);
      }
      .title {
        color: var(--title); font-weight: 800; line-height: 1.15;
        font-size: min(1.4rem, 8cqmin); max-width: 100%; overflow-wrap: anywhere;
      }
      .content {
        color: var(--content); line-height: 1.3;
        font-size: min(1rem, 5cqmin); max-width: 100%; overflow-wrap: anywhere;
      }
      /* Subtle badge so it's clear this is a design preview, not a live alert. */
      .tag {
        position: fixed; top: 6px; left: 8px;
        font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
        color: #888; background: rgba(0, 0, 0, 0.35); padding: 2px 6px; border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="tag">preview</div>
    <div class="box" id="box">
      <img class="img" id="img" alt="" />
      <div class="title" id="title"></div>
      <div class="content" id="content"></div>
    </div>

    <script>
      let config = {};
      let demoTimer = null;
      let hideTimer = null;
      const $ = (id) => document.getElementById(id);
      const duration = () => Number(config.duration) || 5000;

      // Inline placeholder cover — no network request.
      const PLACEHOLDER_IMG =
        "data:image/svg+xml;utf8," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="135">' +
            '<rect width="240" height="135" rx="10" fill="#3a3a3a"/>' +
            '<circle cx="88" cy="58" r="16" fill="#5a5a5a"/>' +
            '<path d="M40 104l44-38 30 26 26-20 60 32z" fill="#5a5a5a"/></svg>',
        );

      function applyConfig() {
        const s = document.body.style;
        const set = (k, v) => v !== undefined && s.setProperty(k, v);
        set("--bg", config.bgColor);
        set("--title", config.titleColor);
        set("--content", config.contentColor);
        set("--accent", config.accentColor);
        if (config.radius !== undefined) s.setProperty("--radius", config.radius + "px");
      }

      function cycle() {
        $("img").src = PLACEHOLDER_IMG;
        $("title").textContent = "Alert title";
        $("content").textContent = "Alert description — what happened, and who did it.";
        document.body.classList.add("show");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => document.body.classList.remove("show"), duration());
      }
      function restartDemo() {
        clearInterval(demoTimer);
        cycle();
        demoTimer = setInterval(cycle, duration() + 1400); // hold, breathe, repeat
      }

      window.addEventListener("message", (e) => {
        const d = e.data;
        if (!d || d.source !== "quicktys") return;
        if (d.type === "config") {
          config = d.config || {};
          applyConfig();
          restartDemo(); // reflect edits (duration/colors) immediately
        }
      });
      applyConfig();
      restartDemo(); // demo even before the first config arrives
      parent.postMessage({ source: "quicktys-widget", type: "ready" }, "*");
    </script>
  </body>
</html>
