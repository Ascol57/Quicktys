[package]
name = "quicktys-module-sdk"
version.workspace = true
edition.workspace = true
# Guest SDK: MIT, NOT the AGPL core licence — it is linked into every
# extension. See LICENSE-SDK and COPYING.md.
license = "MIT"
description = "Guest-side SDK for writing Quicktys MODULES (certified drivers) as WASM components."

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Reused pure schema model (see plugin SDK). `wit_bindgen::generate!` runs in the
# module crate itself (via `define_module!`), so the SDK does not depend on it.
quicktys-schema = { path = "../quicktys-schema" }
