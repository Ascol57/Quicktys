[package]
name = "quicktys-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
# Hybrid classical + post-quantum suite `hyb-mlkem1024-mldsa87-v1` (NIST level 5).
# Confidentiality must resist "harvest now, decrypt later" (drm.md §2.1), so the
# KEM binds X25519 AND ML-KEM-1024 — breaking one is not enough.
fips203 = "0.4"   # ML-KEM-1024 (FIPS 203), pure Rust
fips204 = "0.4"   # ML-DSA-87   (FIPS 204), pure Rust
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"   # XChaCha20-Poly1305 AEAD (192-bit nonce)
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"           # OS entropy for classical key seeds
