[package]
name = "quicktys-regserve"
version.workspace = true
edition.workspace = true
# Commerce side (registry API / signing & packaging tooling): proprietary,
# source-available, (C) Ascol57 — see LICENSE-EXTENSIONS and COPYING.md.
license = "LicenseRef-Ascol57-Proprietary"

[[bin]]
name = "quicktys-regserve"
path = "src/main.rs"

[dependencies]
# Build content-addressed `.qtpkg` blobs and the index, and (optionally) sign the
# index — reusing the same crates the app uses, so a dev registry is byte-faithful.
quicktys-pkg.workspace = true
quicktys-registry.workspace = true
quicktys-crypto.workspace = true
serde_json.workspace = true
