# Build and deploy the Quicktys website (website/) to GitHub Pages.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# One concurrent deployment; let a running one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          # `lastUpdated` in the VitePress config reads git timestamps.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci || npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on for the repository if it is not already, instead of
          # failing with "Get Pages site failed. Please verify that the
          # repository has Pages enabled". Needs the `pages: write` permission
          # declared above.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
